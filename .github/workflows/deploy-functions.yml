name: Deploy DOJO Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Cleanup policy step temporarily disabled
      # - name: Set Artifact Cleanup Policy
      #   run: firebase functions:artifacts:setpolicy --days 7 --location us-central1 --project dojo-platform-b68a3

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project dojo-platform-b68a3
